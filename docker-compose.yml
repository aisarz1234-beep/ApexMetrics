version: '3.8'

services:
  # PostgreSQL 16 Relational Storage
  postgres:
    image: postgres:16-alpine
    container_name: apexmetrics-postgres
    restart: always
    environment:
      POSTGRES_USER: apexuser
      POSTGRES_PASSWORD: apexpassword
      POSTGRES_DB: apexmetrics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexuser -d apexmetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 In-Memory Sorted Set (ZSET) Engine
  redis:
    image: redis:7-alpine
    container_name: apexmetrics-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ApexMetrics Unified Application (Express + Socket.io + React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apexmetrics-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://apexuser:apexpassword@postgres:5432/apexmetrics
      REDIS_URL: redis://redis:6379
      JWT_SECRET: apexmetrics_super_secure_jwt_secret_key_2026_production
      CLIENT_URL: http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
